name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        # For a project site (https://<user>.github.io/<repo>/) set this to "/<repo>".
        # AnimQR.github.io is an organisation site served from the root, so it stays empty.
        env:
          NEXT_PUBLIC_BASE_PATH: ""
          # SEO options (see README → SEO). Unset values fall back to the defaults in src/lib/site.ts.
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
          NEXT_PUBLIC_PRELOAD_URL: ${{ vars.PRELOAD_URL }}
          NEXT_PUBLIC_TWITTER_HANDLE: ${{ vars.TWITTER_HANDLE }}
          NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          NEXT_PUBLIC_BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }}
          NEXT_PUBLIC_YANDEX_VERIFICATION: ${{ vars.YANDEX_VERIFICATION }}
          NEXT_PUBLIC_PINTEREST_VERIFICATION: ${{ vars.PINTEREST_VERIFICATION }}
          NEXT_PUBLIC_NOINDEX: ${{ vars.NOINDEX }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
